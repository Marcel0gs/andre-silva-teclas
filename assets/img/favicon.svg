<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="André Silva Teclas">
  <!-- Favicon do site do André. Teclas em 16px viram borrão, então o desenho é
       de 3 teclas largas, não de um teclado inteiro: em tamanho de aba lê como
       instrumento, e é o que basta. Cores da paleta vintage do site. -->
  <rect width="64" height="64" rx="14" fill="#7a1f2b"/>
  <rect x="14" y="16" width="36" height="32" rx="3" fill="#f7ece0"/>
  <rect x="25" y="16" width="2.5" height="32" fill="#7a1f2b" opacity=".35"/>
  <rect x="36.5" y="16" width="2.5" height="32" fill="#7a1f2b" opacity=".35"/>
  <rect x="20" y="16" width="7" height="19" rx="2" fill="#241412"/>
  <rect x="37" y="16" width="7" height="19" rx="2" fill="#241412"/>
  <rect x="14" y="16" width="36" height="5" fill="#e0a144"/>
</svg>
